<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | P1tada</title>
    <meta name="author" content="Cruz">
    <link rel="stylesheet" href="style2.css"> 

</head>
<body>
    <div class="cadastro-container">
        <div class="cadastro" id="cadastro">
            <header class="info" id="info">
                <h1>Página de Cadastro</h1>
                <h3>Insira suas informações</h3>
            </header>

            <div class="forms" id="forms">
                <form action="#" method="POST"> 
                    
                    <div class="form-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" required>
                    </div>

                    <div class="form-group">
                        <label for="dataNascimento">Data de Nascimento:</label>
                        <input type="date" id="dataNascimento" name="dataNascimento" required>
                    </div>

                    <div class="form-group">
                        <label for="endereco">Endereço:</label>
                        <input type="text" id="endereco" name="endereco" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="genero">Gênero:</label>
                        <select id="genero" name="genero" required>
                            <option value="" disabled selected>Selecione</option>
                            <option value="masculino">Masculino</option>
                            <option value="feminino">Feminino</option>
                            <option value="outro">Outro</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Insira sua senha</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirme a senha</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required> 
                    </div>

                    <div class="botoes">
                        <input type="submit" value="Enviar Cadastro">
                        <button type="button" onclick="window.location.href='index.html'">Voltar à Página Principal</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="rodape" id="rodape">
        <footer>P1tada 2025&copy;</footer>
    </div>
</body>
</html>
